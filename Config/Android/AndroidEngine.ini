; Settings for the Android (Quest and Pico) builds only.
; Some of these repeat what the engine's Android_OpenXR device profile already sets. They are kept here on purpose, so
; that the values DRS relies on are visible in the project.

[/Script/Engine.RendererSettings]
; Hardware occlusion queries cost too much on mobile GPUs. A custom software occlusion feature will replace them.
r.AllowOcclusionQueries=False

[DevOptions.Shaders]
; Stable shader keys (.shk) are required to BUILD a bundled PSO cache. Enable this, along with
; bShareMaterialShaderCode=False in DefaultGame.ini, to bundle a PSO cache instead of relying only on PSO precaching.
NeedsShaderStableKeys=False

[ConsoleVariables]
; Mark the device as a dedicated (stereo-only) headset. Fixes swapchain issues on Pico.
XR.StandAloneStereoOnlyDevice=1

; Precache PSOs to reduce shader hitches. The 'keep in memory' option is Qualcomm/Adreno-only (Quest and Pico both
; qualify). In-memory PSOs stay bounded by r.PSOPrecache.KeepInMemory{Graphics,Compute}MaxNum.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.KeepInMemoryUntilUsed=1

; Fixed foveated rendering through the OpenXR FB foveation extension (enabled by the MetaXR plugin's Engine.ini).
xr.OpenXRFBFoveationLevel=3
xr.OpenXRFBFoveationDynamic=True
r.Vulkan.VRSFormat=3

; Passthrough needs two settings, and is reported as unsupported without both:
; - r.Mobile.PropagateAlpha=True (set in DefaultEngine.ini [/Script/Engine.RendererSettings], where UBT reads it when
;   packaging) keeps the scene alpha and tells the compositor to use it.
; - xr.OpenXRInvertAlpha flips UE's alpha convention (0 = opaque) to OpenXR's (XR_EXT_composition_layer_inverted_alpha).
; Without passthrough the headset composites the scene over black, so neither setting changes the image, except that
; stereo layers placed beneath the scene now show through see-through areas.
xr.OpenXRInvertAlpha=True

[Core.Log]
; Android has no working memory-mapped bulk data path, so the loader falls back to a normal read. The fallback is
; harmless but floods LogSerialization with "Memory map bulk data '...' FAILED" warnings.
LogSerialization=Error
