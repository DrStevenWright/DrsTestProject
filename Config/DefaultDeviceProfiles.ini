; Custom device profiles. The engine's own Android matching rules (BaseDeviceProfiles.ini) are left in place for now;
; check on device which profile each headset gets before replacing them.

[DeviceProfiles]
+DeviceProfileNameAndTypes=Pico_4U,Android

[Meta_Quest_3 DeviceProfile]
+CVars=r.Streaming.PoolSize=3000

; Pico 4 Ultra: same GPU as Quest 3 (Adreno 740). Only selected once a matching rule for it exists.
[Pico_4U DeviceProfile]
BaseProfileName=Meta_Quest_3
