; Custom device profiles for the headsets DRS supports: Quest 3, Quest 3S and Pico 4 Ultra.

[DeviceProfiles]
+DeviceProfileNameAndTypes=Pico_4U,Android

; Matching rules are checked in order and the first match wins. Project rules are appended after the engine's, and the
; engine's generic Adreno rules would catch the Pico before any rule of ours. So clear the engine's list and re-add only
; what DRS needs. Devices that match nothing get the base Android profile.
[/Script/AndroidDeviceProfileSelector.AndroidDeviceProfileMatchingRules]
!MatchProfile=ClearArray
; Quest 3 and 3S: copied unchanged from the 5.8 engine's BaseDeviceProfiles.ini
+MatchProfile=(Profile="Meta_Quest_3",Match=((SourceType=SRC_DeviceMake,CompareType=CMP_Equal,MatchString="Oculus"), (SourceType=SRC_HMDSystemName,CompareType=CMP_Equal,MatchString="Meta Quest 3")))
+MatchProfile=(Profile="Meta_Quest_3S",Match=((SourceType=SRC_DeviceMake,CompareType=CMP_Equal,MatchString="Oculus"), (SourceType=SRC_HMDSystemName,CompareType=CMP_Equal,MatchString="Meta Quest 3S")))
; Pico 4 Ultra: from the old template project
+MatchProfile=(Profile="Pico_4U",Match=((SourceType=SRC_DeviceMake,CompareType=CMP_Equal,MatchString="Pico"), (SourceType=SRC_GpuFamily,CompareType=CMP_Equal,MatchString="Adreno (TM) 740")))
; Any other Meta headset (unsupported) still gets the engine's OpenXR settings
+MatchProfile=(Profile="Android_OpenXR",Match=((SourceType=SRC_DeviceMake,CompareType=CMP_Equal,MatchString="Oculus")))

[Meta_Quest_3 DeviceProfile]
+CVars=r.Streaming.PoolSize=3000

; The engine matches Quest 3S to its own profile, which is based on Android_OpenXR rather than Meta_Quest_3.
; Keep its CVars in step with Meta_Quest_3 above; the two engine profiles set identical CVars.
[Meta_Quest_3S DeviceProfile]
+CVars=r.Streaming.PoolSize=3000

; PC, including Quest over Link
[Windows DeviceProfile]
+CVars=r.Streaming.PoolSize=4000

; Pico 4 Ultra: same GPU as Quest 3 (Adreno 740), so it builds on the Quest 3 profile and its OpenXR settings.
[Pico_4U DeviceProfile]
BaseProfileName=Meta_Quest_3
